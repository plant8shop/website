    <section id="about" class="section intro-section">
      <div class="section-inner">
        <picture>
          <source srcset="assets/logo-full-display.webp" type="image/webp">
          <img
            src="assets/logo-full.png"
            alt="プラントショップのロゴ"
            class="about-logo"
            width="1600"
            height="900"
            fetchpriority="high"
          >

        <div class="section-heading">

          <h2>概要</h2>
        </div>
        <div id="aboutContent"></div>

    <section id="announcements" class="section news-section">
      <div class="section-inner">
        <div class="section-heading">

          <h2>告知</h2>
        </div>
        <div class="news-column">

            <a
              class="contact-sns-link"

              target="_blank"

          </div>
          <div class="announcement-tabs" role="tablist" aria-label="告知の表示切り替え">

              class="announcement-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="newsList"
              data-announcement-status="latest"
            >最新</button>
            <button
              class="announcement-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="newsList"

            >済み</button>

          <div id="newsList" class="news-list" role="tabpanel" aria-live="polite"></div>
        </div>
      </div>
