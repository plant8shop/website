<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="街を歩いて見つけた場所から生まれた脚本を、地図と写真で読むプロトタイプです。">
  <meta name="robots" content="noindex, nofollow">
  <title>場所から読む脚本｜プラントショップ</title>
  <link rel="preconnect" href="https://cyberjapandata.gsi.go.jp">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="place-fiction.css">
</head>
<body>
  <main class="map-stage">
    <div id="map" class="map-canvas" aria-label="脚本スポットの地図"></div>

    <header class="map-header">
      <div>
        <p class="eyebrow">PLACE / FICTION / 0712</p>
        <h1>場所から読む脚本</h1>
      </div>
      <p class="map-header-note">地図の印を押すと、その場所から生まれた脚本が開きます。</p>
    </header>

    <div id="mapStatus" class="map-status" role="status" aria-live="polite">
      <span class="map-status-mark" aria-hidden="true">×</span>
      <div>
        <strong>脚本スポットを準備しています</strong>
        <span>公開された場所がここに並びます。</span>
      </div>
    </div>

    <aside id="storyPanel" class="story-panel" aria-hidden="true" aria-labelledby="storyTitle">
      <button id="closePanel" class="panel-close" type="button" aria-label="脚本を閉じる">閉じる</button>
      <div id="storyContent" class="story-content"></div>
    </aside>

    <div id="panelScrim" class="panel-scrim" hidden></div>
  </main>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="place-fiction.js"></script>
</body>
</html>
